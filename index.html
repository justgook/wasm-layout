<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Layout WASM Mock Host</title>
  <style>
    :root {
      color-scheme: dark;
    }

    body {
      margin: 0;
      font-family: "Iosevka Web", "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      background: radial-gradient(circle at top, #142433 0%, #0c141d 55%, #070b10 100%);
      color: #d8e3ef;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 20px;
    }

    .panel {
      width: min(920px, 100%);
      background: rgba(13, 22, 32, 0.88);
      border: 1px solid #25384b;
      border-radius: 14px;
      padding: 14px;
      box-shadow: 0 18px 44px rgba(0, 0, 0, 0.35);
    }

    h1 {
      margin: 0 0 10px;
      font-size: 16px;
      letter-spacing: 0.04em;
    }

    pre {
      margin: 0;
      background: #0a121a;
      border: 1px solid #203347;
      border-radius: 10px;
      padding: 10px;
      min-height: 180px;
      max-height: 60vh;
      overflow: auto;
      font-size: 12px;
      line-height: 1.45;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>
  <section class="panel">
    <h1>Layout WASM Mock Host</h1>
    <pre id="out">Loading...</pre>
  </section>

  <script type="module">
    const out = document.getElementById("out");

    function log(line) {
      out.textContent += `${line}\n`;
      out.scrollTop = out.scrollHeight;
    }

    async function boot() {
      const HEADER_I32 = 13;
      const AREA_I32 = 5;
      const HANDLE_I32 = 5;
      const MAX_PANELS = 16;

      out.textContent = "";
      const response = await fetch("./layout.wasm");
      const wasmBytes = await response.arrayBuffer();

      const memory = new WebAssembly.Memory({
        initial: 288,
        maximum: 512,
        shared: true
      });

      const {instance} = await WebAssembly.instantiate(wasmBytes, {
        env: {memory}
      });

      const api = instance.exports;
      log("WASM ready");
      log(`exports: ${Object.keys(api).sort().join(", ")}`);

      const dataPtr = api.get_data_ptr();
      log(`data ptr: ${dataPtr}`);

      let err = api.init_screen(1200, 800);
      log(`init_screen(1200, 800) => ${err}`);

      err = api.move_handle(0, 650, 400);
      log(`move_handle(0, 650, 400) before split => ${err}`);

      err = api.set_area_content(0, 42);
      log(`set_area_content(0, 42) => ${err}`);

      err = api.move_corner(0, 2, 700, 500);
      log(`move_corner(0, 2, 700, 500) split => ${err}`);

      err = api.move_corner(0, 1, 720, 200);
      log(`move_corner(0, 1, 720, 200) merge path => ${err}`);

      err = api.move_handle(0, 400, 300);
      log(`move_handle(0, 400, 300) => ${err}`);

      err = api.set_handle_content(0, 777);
      log(`set_handle_content(0, 777) => ${err}`);

      const i32 = new Int32Array(memory.buffer, dataPtr, HEADER_I32 + (MAX_PANELS * AREA_I32) + (4 * HANDLE_I32));
      const header = Array.from(i32.slice(0, HEADER_I32));
      const area0 = Array.from(i32.slice(HEADER_I32, HEADER_I32 + AREA_I32));

      const handleStart = HEADER_I32 + (MAX_PANELS * AREA_I32);
      const handle0 = Array.from(i32.slice(handleStart, handleStart + HANDLE_I32));
      const handle1 = Array.from(i32.slice(handleStart + HANDLE_I32, handleStart + HANDLE_I32 * 2));

      log(`header[0..${HEADER_I32 - 1}]: ${header.join(", ")}`);
      log(`area0[x0,y0,x1,y1,content]: ${area0.join(", ")}`);
      log(`handle0[x0,y0,x1,y1,content]: ${handle0.join(", ")}`);
      log(`handle1[x0,y0,x1,y1,content]: ${handle1.join(", ")}`);
    }

    boot().catch((err) => {
      out.textContent = "";
      log(`Boot failed: ${err.message}`);
      console.error(err);
    });
  </script>
</body>

</html>
